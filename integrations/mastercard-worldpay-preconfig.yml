arazzo: 1.0.1
info:
  title: 'mastercard through worldpay: fastAccess preconfigured with mastercard'
  summary: Calls worldpay's fastAccess with `mastercard` preset, the way mastercard is used inside worldpay.
  description: 'A PRECONFIGURATION, not an orchestration: mastercard is a network inside worldpay, so the integration
    is worldpay''s own operation with mastercard''s enum value set. Derived from worldpay''s contract (worldpay-payouts-api-openapi.yml);
    required properties are inputs.'
  version: 1.0.0
x-integration:
  partner: worldpay
  relationship: network
  preconfig: true
  edge_evidence: https://github.com/api-evangelist/worldpay/blob/main/openapi/worldpay-payouts-api-openapi.yml
  edge_type: contract
  preset:
    instruction.routing.preferredCardBrand: mastercard
  method: derived
  generated: '2026-10-12'
  generator: build-integration-preconfigs.py
sourceDescriptions:
- name: worldpayPayoutsApiOpenapi
  url: https://raw.githubusercontent.com/api-evangelist/worldpay/refs/heads/main/openapi/worldpay-payouts-api-openapi.yml
  type: openapi
workflows:
- workflowId: mastercard-via-worldpay-fastaccess
  summary: fastAccess with mastercard preset
  inputs:
    type: object
    required:
    - merchant
    - transactionReference
    properties:
      merchant:
        type: string
      transactionReference:
        type: string
  steps:
  - stepId: call-with-preset
    operationId: $sourceDescriptions.worldpayPayoutsApiOpenapi.fastAccess
    requestBody:
      contentType: application/vnd.worldpay.payouts-v4+json
      payload:
        merchant: $inputs.merchant
        transactionReference: $inputs.transactionReference
        instruction:
          routing:
            preferredCardBrand: mastercard
    successCriteria:
    - condition: $statusCode == 201
    outputs:
      id: $response.body#/id
  outputs:
    id: $steps.call-with-preset.outputs.id
